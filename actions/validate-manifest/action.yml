name: Validate handbook manifest
description: >-
  Validates a wporg-markdown importer manifest.json (path-keyed, parents first, no slug takeovers, GitHub blob
  sources, one H1 per file, no raw block markup) so a merge cannot break the developer.wordpress.org import.
inputs:
  manifest:
    description: Path to manifest.json
    required: true
    default: manifest.json
  docs:
    description: Directory the markdown_source paths resolve under (usually the repo root)
    required: false
    default: .
  frozen:
    description: Optional JSON file listing the keys that must keep existing (and their frozen order)
    required: false
    default: ''
  allow-missing-parent:
    description: Space-separated keys whose parent is intentionally absent from the manifest
    required: false
    default: ''
  strict:
    description: Treat warnings as errors
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - shell: bash
      # The validator has no dependencies, so it runs straight from the checked-out action without an install.
      run: |
        ARGS=("${{ inputs.manifest }}" --docs "${{ inputs.docs }}")
        if [ -n "${{ inputs.frozen }}" ]; then ARGS+=(--frozen "${{ inputs.frozen }}"); fi
        if [ -n "${{ inputs.allow-missing-parent }}" ]; then ARGS+=(--allow-missing-parent ${{ inputs.allow-missing-parent }}); fi
        if [ "${{ inputs.strict }}" = "true" ]; then ARGS+=(--strict); fi
        node "${{ github.action_path }}/../../packages/manifest/src/cli.js" "${ARGS[@]}"
